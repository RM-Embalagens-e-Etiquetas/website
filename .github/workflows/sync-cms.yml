name: Sync CMS

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'safe = não sobrescreve edições do admin | force = sobrescreve tudo do repo | media = só fotos'
        required: true
        default: safe
        type: choice
        options:
          - safe
          - force
          - media

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Sync content to Payload
        run: |
          if [ "${{ inputs.mode }}" = "force" ]; then
            npm run seed
          elif [ "${{ inputs.mode }}" = "media" ]; then
            npm run content:sync:media
          else
            npm run content:sync
          fi
        env:
          PAYLOAD_SECRET: ${{ secrets.PAYLOAD_SECRET }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          BLOB_STORE_ACCESS: private
          NEXT_PUBLIC_SERVER_URL: https://rm-embalagens.vercel.app
          SEED_ADMIN_EMAIL: ${{ secrets.SEED_ADMIN_EMAIL }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
